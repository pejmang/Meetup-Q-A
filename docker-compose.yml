services:
  meetup-qa:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin2027}
    volumes:
      - qa-data:/data
volumes:
  qa-data:
