services:
  meetup-qa:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      BASE_PATH: ${BASE_PATH:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DEMO_RESET_EVENTS: ${DEMO_RESET_EVENTS:-}
      DEMO_RESET_MIN: ${DEMO_RESET_MIN:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MAX_SPACES_PER_EMAIL: ${MAX_SPACES_PER_EMAIL:-3}
      REQUIRE_PRO_EMAIL: ${REQUIRE_PRO_EMAIL:-}
      PUBLIC_DEMO_URL: ${PUBLIC_DEMO_URL:-}
      PUBLIC_DEMOS: ${PUBLIC_DEMOS:-}
    volumes:
      - qa-data:/data
volumes:
  qa-data:
